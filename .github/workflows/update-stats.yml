name: Update GitHub Stats & Generate SVG

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Fetch GitHub Stats
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: python3 fetch_stats.py

    - name: Generate SVG Profile Cards
      run: python3 build_svg.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add details.json light_mode.svg dark_mode.svg
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update GitHub stats and generate SVGs [skip ci]"
          git push
        fi
